# =============================================================================
#  UNIVERSAL HEATSOAK MACRO  —  Heatsoak_Universal.cfg
# =============================================================================
#
#  Drop this file into your Klipper config and [include] it.
#  Then:
#    1. Edit _HEATSOAK_CFG to match your printer
#    2. Implement PRINTER_HEATSOAK_PARK (or leave default: bed center)
#    3. Implement PRINT_START_BASE with your machine-specific pre-print sequence
#    4. Your machine's actual renamed pause/resume macro names (BASE_PAUSE vs
#       PAUSE_BASE, and BASE_RESUME vs RESUME_BASE, depending on how your
#       [gcode_macro PAUSE]/[gcode_macro RESUME] overrides set
#       `rename_existing`) are auto-detected at runtime by
#       _resolve_pause_macro()/_resolve_resume_macro() -- no manual
#       verification needed before deploying. If your [gcode_macro PAUSE]/
#       [gcode_macro RESUME] has no rename_existing configured, it hard-errors
#       with a clear message instead of failing silently (see CHANGELOG --
#       this used to require manual verification and a wrong guess once let
#       a real layer print under a "running" soak on the Voron 0,
#       2026-08-04/05; see MMU SUPPORT SECTION note at the bottom for the
#       full story).
#    5. If your printer has an MMU, see the MMU SUPPORT SECTION near the
#       bottom of this file -- otherwise delete that whole section.
#
#  SLICER START GCODE:
#    PRINT_START BED={bed_temperature} EXTRUDER={temperature}
#    Optional: CHAMBER={chamber_temp}
#
#  FEATURES
#  --------
#  * Soak time scales with print duration parsed from filename (1h30m etc.)
#    Falls back to soak_default_minutes if no time code found in filename.
#  * Countdown heartbeat doesn't start until the bed has actually reached
#    target temp -- not from the moment the soak begins -- via a non-blocking
#    poll, not M190 (see the 2026-08-31 and 2026-09-14 CHANGELOG entries).
#    Nozzle heat and PRINTER_HEATSOAK_PARK (your heatsoak-tasks hook) both run
#    in parallel with the bed instead of gating the countdown behind them too.
#  * Optional chamber sensor: waits for temp before countdown begins,
#    and/or skips soak if chamber is already close enough to target.
#    Chamber target comes from the CHAMBER= param passed by slicer.
#    Uses fuzzy suffix matching -- no need for exact sensor key.
#  * Multiple fans at individual speeds during soak; all zeroed on completion.
#  * Popup appears BEFORE machine starts moving (prep fires via delayed_gcode).
#  * Shows largest part footprint area when exclude_object is available.
#  * Real SVG build-plate layout (every part's outline) sent to the
#    Console tab (Mainsail/Fluidd) when exclude_object data is available --
#    separate from the popup, which can't render markup.
#  * Skip / Adjust / Cancel buttons in Mainsail / Fluidd / KlipperScreen.
#  * heatsoak_active flag prevents double-fire on SKIP or stale TICK.
#  * CANCEL restores gcode state stack so next print starts clean.
#  * Adaptive tick interval (5 min -> 1 min -> 10 s -> 5 s).
#  * A REAL blocking pause (auto-detected BASE_PAUSE/PAUSE_BASE and
#    BASE_RESUME/RESUME_BASE) actually halts the print queue during the
#    soak -- see the INIT branch below for why this matters.
#  * Stale heatsoak_active state from before a Klipper restart is
#    automatically cleared on startup.
#  * Any CANCEL_PRINT (Mainsail's button, a raw API call, the popup's own
#    Cancel) tears down an active soak cleanly, via a one-line
#    _HEATSOAK_CANCEL_TEARDOWN hookup in your own CANCEL_PRINT -- this file
#    never overrides your CANCEL_PRINT itself (see CHANGELOG 2026-10-02).
#  * A stale pause left over from before the print can't defeat the soak's
#    pause (CLEAR_PAUSE at print start), and if the pause ever fails to
#    stop the file anyway, a 1s-later guard cancels instead of printing.
#  * Resume during a soak (Mainsail/Fluidd/KlipperScreen/touchscreen) acts
#    as Skip instead of starting the print body under a still-running soak,
#    via a one-line _HEATSOAK_RESUME_CHECK hookup in your own RESUME (same
#    pattern as the cancel hookup; see CHANGELOG 2026-10-03).
#
# =============================================================================
#
# =============================================================================
#  CHANGELOG
# =============================================================================
#  2026-08-04/05 -- Two real bugs found and fixed while deploying this on the
#  Voron 0 (full story in the MMU SUPPORT SECTION note near the bottom):
#    1. get_duration_from_name's regex lacked a negative lookahead, so
#       filenames like "3dbenchy...0.25mm...2h20m.gcode" misread "3d" as
#       3 days and "25m" out of "0.25mm" as 25 minutes -- inflated an
#       8-minute print to "146h 45m" and always clamped to the 45-min
#       ceiling. Fixed: (?![a-zA-Z]) restored, case-sensitivity restored
#       (dropped the |lower).
#    2. Storing the slicer's raw {rawparams} string in `state` and later
#       re-serializing the whole dict via SET_GCODE_VARIABLE ... VALUE=
#       "{state}" breaks if any param value contains embedded double quotes
#       (e.g. a slicer passing SURFACE="High Temp Plate") -- the outer
#       quoting collides and Klipper logs "Malformed command", silently
#       never saving state. Fixed: store the already-decoded named fields
#       (LAYER/FILAMENT/EXCLUDE/SURFACE/OAPA/DMGCC, or whatever your slicer
#       passes) instead of the raw string, and re-quote fresh at the
#       PRINT_START_BASE call site in resume_and_start().
#
#  2026-08-06 -- Standing requirement added: homing (Z at minimum), leveling/
#  QGL, and bed mesh must ALWAYS happen hot, after the soak -- see the
#  "Re-home, level, mesh" comment block in PRINT_START_BASE below for the
#  full rationale and a concrete gotcha (a leveling module's "already
#  applied" flag silently skipping a hot re-level because a pre-soak homing
#  pass had already flipped it true) hit for real on the Rat (RatOS).
#
#  2026-08-27 -- Pause/resume macro name (BASE_PAUSE vs PAUSE_BASE,
#  BASE_RESUME vs RESUME_BASE) is now auto-detected at runtime via
#  _resolve_pause_macro()/_resolve_resume_macro(), instead of being
#  hardcoded and requiring manual per-printer verification before deploying.
#  Hard-errors via action_raise_error if no rename_existing is configured,
#  rather than risking the old silent "Unknown command" failure mode. Also
#  fixed: the soak-adjust popup buttons (+15/+10/+5/-5/-10/-15) rendered in a
#  3-per-row grid with mismatched +/- pairs in the outer two columns --
#  reordered so each column is a matched pair.
#
#  2026-08-27 (later same day) -- The resolver above was itself broken on
#  first deploy: `printer["gcode_macro BASE_PAUSE"] is defined` can never be
#  true for a rename_existing target derived from PAUSE/RESUME, since those
#  are backed by pause_resume.py, not a [gcode_macro X] section -- confirmed
#  live when a real HEATSOAK call on the Voron 0 hard-errored even though
#  BASE_PAUSE was a freshly-confirmed-registered real command. Fixed by
#  reading printer.configfile.settings["gcode_macro pause"/"resume"].
#  rename_existing directly instead of probing for a status object.
#  Pause-side fix live-confirmed on the Voron 0 via a real HEATSOAK call;
#  resume-side fix applied the same way but not yet separately live-tested
#  (Voron 0's own resume path diverged for MMU reasons before this fix, so
#  it never exercised _resolve_resume_macro at all).
#
#  2026-08-27 (same day, beta) -- Countdown heartbeat (_HEATSOAK_UPDATE) used
#  to be scheduled from INIT, in parallel with _HEATSOAK_PREP's bed/nozzle
#  wait, not after it. Klipper's reactor keeps pumping other delayed_gcode
#  timers while a blocking wait like M190 is paused, so soak_left could
#  count all the way down -- and resume_and_start() actually RESUME the
#  print -- before the bed had even reached target temp, let alone before
#  nozzle-heat/park ran. Not just cosmetic: a short enough soak_sec on a
#  slow-heating bed could resume mid-heat. Fixed by moving the first
#  UPDATE_DELAYED_GCODE ID=_HEATSOAK_UPDATE call out of INIT and into the end
#  of [delayed_gcode _HEATSOAK_PREP], right after PRINTER_HEATSOAK_PARK --
#  the visible countdown (and the resume it eventually triggers) now cannot
#  start until bed+nozzle+park are actually done.
#
#  2026-08-27 (later still) -- SVG build-plate layout added, after checking
#  Contomo's actual source (github.com/Contomo/klipper-questionable-macros)
#  instead of guessing: his PART_AREA macro sends a real <svg> string via a
#  BARE action_respond_info() call, not through the action:prompt_* popup
#  protocol -- that's a different, text/button-only channel that can't carry
#  markup at all. Ported as draw_buildplate_layout_svg(), called once per
#  soak (not per tick) right after the popup first shows. Renders in the
#  Console tab, not the popup -- not yet live-tested on real hardware.
#
#  2026-08-31 (beta, not yet print-tested) -- The popup used to show a
#  static "Soak remaining: Xm" the whole time the bed/nozzle were heating up
#  (since the real countdown heartbeat, by design, doesn't start until
#  heating is done -- see the 2026-08-27 entry above), which reads as
#  frozen/stuck on a slow-heating bed. Added a state.heating flag (true at
#  INIT, flipped false once bed+nozzle are actually reached) so show_ui()
#  can branch to a live "Bed: Xc / Yc" (and "Nozzle: Xc / Yc" once
#  cfg.soak_nozzle_temp > 0) display during heat-up, then switch back to
#  the normal "Soak remaining" countdown once heating finishes.
#
#  First attempt (same day) used M190/M109 unchanged for the actual wait,
#  plus a SEPARATE delayed_gcode heartbeat (_HEATSOAK_HEATUP_TICK) meant to
#  tick every 3s DURING that wait and redraw the popup. Live-tested on SV0
#  and found completely broken -- zero popup updates the entire ~7-minute
#  bed heat-up. Root cause, confirmed by reading klippy/gcode.py and
#  klippy/reactor.py directly: Klipper serializes ALL gcode script
#  execution through a single mutex (GCodeDispatch.run_script()'s
#  `with self.mutex:`), held for the ENTIRE duration of a blocking call
#  like M190/M109 -- not released between the reactor.pause() cycles
#  inside M190's own wait loop. A separate delayed_gcode's TIMER can still
#  fire during that wait (that part of the 2026-08-27 comment was right),
#  but the gcode it tries to run (ReactorMutex.__enter__, which queues the
#  current greenlet and reactor.pause()s until woken by __exit__) blocks
#  waiting for that same mutex and doesn't actually execute until the
#  blocking script finishes and releases it -- by which point
#  state.heating had already been flipped false by _HEATSOAK_PREP itself,
#  so the queued tick saw that and silently no-op'd. Nothing was
#  physically stuck (M190/M109 completed normally on their own, unaffected
#  by the broken heartbeat), just the popup never visibly updated.
#
#  Real fix: replaced the blocking M190/M109 in _HEATSOAK_PREP with a
#  non-blocking M140/M104 plus a POLLING heartbeat (still named
#  _HEATSOAK_HEATUP_TICK) that checks printer.heater_bed.temperature /
#  printer.extruder.temperature against target on each of its own
#  independent ticks (every 2s), updates the popup, and re-arms itself
#  until both are within tolerance (1c bed / 2c nozzle -- intentionally
#  looser than Klipper's own PID-settle wait, which also checks the rate
#  of change, not just the value; close enough for a pre-print soak
#  target). Once both are reached, that same tick parks, flips
#  state.heating false, and starts the real countdown heartbeat --
#  replacing what M190/M109/PRINTER_HEATSOAK_PARK used to do inline in
#  _HEATSOAK_PREP. Each poll tick is its own independent, always-completing
#  script (no nested blocking call), so it never contends with the mutex
#  the way the first attempt did. Also fixed a related latent bug found
#  while adding the heating-flag concept: the ADJUST (+/- minute buttons)
#  handler unconditionally armed _HEATSOAK_UPDATE (DURATION=0.2) on every
#  click, including during the heating phase -- which would have
#  re-triggered the exact "countdown starts before the bed is at temp" bug
#  from the 2026-08-27 fix if a user ever hit Adjust before heating
#  finished. Now guarded behind `not state.get("heating", false)`.
#
#  Verified by parsing every gcode: block with a local Jinja env
#  replicating Klipper's exact config (single-brace delimiters plus
#  Klipper's own #-strips-to-newline raw preprocessing) -- no
#  TemplateSyntaxErrors. The mutex root-cause finding itself was verified
#  by reading the live klippy/gcode.py and klippy/reactor.py source on
#  SV0's own Klipper install directly (not assumed from memory), and by
#  checking SV0's real klippy.log/gcode_store for the test run that
#  exposed the first attempt's bug. The corrected poll-based version is
#  NOT yet print-tested on real hardware -- pushed to a `beta` branch on
#  GitHub, not main, pending real prints.
#
#  2026-09-14 (beta) -- Deployed on a real Klipper toolchanger (Sovol SV08,
#  6-toolhead design, 3 built) for the first time, which forced two real
#  engine changes that apply to every machine, not just toolchangers:
#
#  1. The HEATUP TICK BRANCH used to gate PRINTER_HEATSOAK_PARK behind BOTH
#     bed_ready AND nozzle_ready, checked sequentially (nozzle heat command
#     wasn't even issued until the bed finished -- a real, if minor, wasted
#     wait on every machine, not just this one). On the toolchanger, a
#     per-tool calibration macro placed in PRINTER_HEATSOAK_PARK made this
#     actively wrong: whichever of bed/calibration took longer became the
#     effective gate, and calibration was consistently the slower one in
#     practice, so the "run stuff in parallel with heat-up" intent of this
#     hook was defeated -- it was really running sequentially after,
#     disguised as parallel. Fixed by making bed the ONLY gate (nozzle now
#     heats in parallel in _HEATSOAK_PREP, unconditionally, and
#     PRINTER_HEATSOAK_PARK is responsible for its own heating needs if any
#     -- see the USER HOOK section's self-heating note). Soak time itself
#     (state.soak_total, renamed from soak_left since it's no longer a
#     decrementing counter -- see point 2) still only starts counting once
#     the bed is actually at temperature, unchanged in spirit from the
#     2026-08-27 standing requirement -- soaking is about holding the frame
#     hot AT temperature, not from when heat-up begins. What changed is that
#     PRINTER_HEATSOAK_PARK now runs in the same breath the countdown starts
#     rather than gating it, so its real duration is correctly absorbed
#     into the already-running deadline instead of stacking after it.
#
#  2. Hit a genuine Klipper macro-execution constraint while building #1:
#     verified against klippy/extras/gcode_macro.py's GetStatusWrapper that
#     an ENTIRE gcode_macro's Jinja template renders to one flat gcode
#     string before any of it executes for real, with printer.* status
#     cached per-render -- so a Jinja-level "how long did that take" check
#     placed right after a long macro call in the SAME template invocation
#     cannot see that call's real duration; it evaluates before the call
#     ever runs for real. This is why "resume immediately if
#     PRINTER_HEATSOAK_PARK alone ran past the deadline" is NOT checked
#     synchronously in the HEATUP TICK BRANCH -- that would be dead code.
#     Instead a short (1s) follow-up heartbeat is armed unconditionally
#     right after the hook returns; THAT separate, later call gets a fresh
#     printer-status read and correctly detects an already-passed deadline,
#     a few real seconds late but correct rather than synchronous but wrong.
#     Full technical writeup: reference_klipper_macro_jinja_render_timing in
#     the author's own memory system, not reproduced in full here.
#
#  Also fixed along the way: the ADJUST (+/- minute buttons) branch used to
#  unconditionally treat state.soak_left as an existing deadline-relative
#  counter -- clicking Adjust during the heating phase (before any deadline
#  exists yet) computed nonsense. Now branches on state.heating: adjusts
#  soak_total (the not-yet-started budget) while still heating, or the real
#  soak_deadline once counting down.
#
#  Verified via an offline Jinja render-based test harness (mocked printer
#  object, simulated multi-call tick sequences with controlled fake
#  timestamps) covering: normal case (hook finishes well before the
#  deadline), hook-runs-longer-than-the-whole-soak edge case (confirms the
#  next-tick resume works), and the ADJUST-during-heating fix -- not yet
#  print-tested against real per-tool calibration hardware timing, only
#  against the toolchanger's own deployed fork with the same test harness.
#
#  2026-10-02 -- Real failure on Printer Max (Neptune 4 Max): the soak's own
#  pause silently did nothing, so the print body ran underneath the popup
#  while the soak's timers dropped the nozzle to soak_nozzle_temp -- the
#  first layer started going down on a cooling nozzle and a half-warm bed.
#  Same root cause as the RatOS incident (2026-09-16), which was only ever
#  fixed on that one printer, never here:
#    A PAUSE fired while the printer was IDLE (here: the filament runout
#    sensor tripping during a manual filament load; UNLOAD_FILAMENT/M600
#    macros that end in PAUSE do the same) leaves pause_resume.is_paused =
#    True with no print running. Nothing clears it, so the next print's
#    pause call hits Klipper's "Print already paused" early-return and
#    never actually stops virtual_sdcard.
#  Hardening, all generic (applies to every printer running this file):
#    1. CLEAR_PAUSE at the very top of the INIT branch. Any pause flag that
#       exists at print start is stale by definition. Covers the no-soak
#       path too (a stale flag there would silently disable a real mid-print
#       runout pause later).
#    2. _HEATSOAK_PAUSE_GUARD: a 1s-later backstop check. If the soak is
#       active but virtual_sdcard is still reading the file, the pause did
#       NOT take (for this or any future reason) -- abort loudly via
#       CANCEL_PRINT instead of printing on unready heaters. Has to be a
#       separate delayed call, not a same-render check: see the 2026-09-14
#       note on Jinja render timing.
#    3. This file no longer defines its own [gcode_macro CANCEL_PRINT].
#       Klipper MERGES same-named sections across included files (last one
#       wins per option) instead of erroring, so the old wrapper's
#       gcode/rename_existing silently REPLACED the printer's own
#       CANCEL_PRINT body -- found live on Sophie (2026-09-18) and Max
#       (2026-10-02): cancel left both heaters on, never parked, never
#       turned the motors off, because only stock Klipper cancel ran.
#       Replaced by _HEATSOAK_CANCEL_TEARDOWN, which you call from your own
#       CANCEL_PRINT (see that section for the one-line hookup). A startup
#       self-check warns in the console if the hookup is missing, or if an
#       old copy of the wrapper is still merged in.
#    4. Soak heartbeats now tear the soak down themselves if the print has
#       already ended (print_stats cancelled/error/complete), as a backstop
#       for any cancel path that skips the teardown.
#
#  2026-10-03 -- Resume during a soak = Skip. Before this, pressing Resume
#  (any UI, or a printer's touchscreen) while the soak was paused ran the
#  printer's normal RESUME: the file carried on into the print body on a
#  bed that wasn't soaked, with no post-soak re-home/mesh, while the soak's
#  own timers kept counting down in the background. Now:
#    1. _HEATSOAK_RESUME_CHECK, called first thing in your own RESUME (one
#       line, like the cancel hookup -- this file still never defines RESUME
#       itself, because Klipper would MERGE it over yours, see 2026-10-02).
#       During an active soak it schedules a Skip and then stops the rest of
#       your RESUME by raising an error (the only way a called macro can
#       stop its caller in Klipper). You see one red "Resume pressed during
#       the soak" line, then the normal Skip runs: popup closes, soak
#       resumes the print properly through PRINT_START_BASE. No-op when no
#       soak is active, so normal pause/resume is untouched.
#    2. The startup self-check now also errors if no RESUME hookup is found.
#       Accepted spots: your [gcode_macro RESUME] gcode, mainsail/fluidd
#       client.cfg's _CLIENT_VARIABLE variable_user_resume_macro, or Happy
#       Hare's _MMU_CLIENT_VARS variable_user_resume_extension.
# =============================================================================


# =============================================================================
#  PRINTER CONFIGURATION  --  edit everything in this section
# =============================================================================

[gcode_macro _HEATSOAK_CFG]
description: Central configuration -- edit here, not in the logic macros

# -- Chamber sensor -----------------------------------------------------------
# Suffix of your chamber sensor name as it appears in printer.cfg.
# Matching is case-insensitive suffix -- so "chamber_temp", "chamber", or
# "CHAMBER_TEMP" all work without needing the full "temperature_sensor ..." key.
# Set to "" to disable all chamber logic entirely.
variable_chamber_sensor: ""

# Countdown holds until chamber reaches the CHAMBER temp passed by the slicer.
# Set to 0 to disable (default: off).
variable_chamber_wait_temp: 0.0

# If the chamber is already within this many degrees of the CHAMBER target
# passed by the slicer, skip the soak entirely (printer already hot from a
# previous print). e.g. 5 means: if CHAMBER=45 and chamber reads >=40 skip.
# Requires slicer to pass CHAMBER= -- if it does not, this check is skipped.
# Set to 0 to disable.
variable_skip_if_chamber_within: 0.0

# -- Soak time calculation ----------------------------------------------------
# Seconds to soak per minute of estimated print time.
# e.g. 5 -> 60 min print = 5 min soak, 30 min print = 2.5 min soak
variable_soak_sec_per_print_min: 5.0

# If no time code is found in the filename, assume this many minutes of print time.
variable_soak_default_minutes: 5.0

# Hard floor and ceiling on soak time (seconds).
variable_soak_min_seconds: 300.0
variable_soak_max_seconds: 2700.0

# -- Trigger conditions -------------------------------------------------------
# Soak is SKIPPED entirely when bed temp OR print duration is below these:
variable_min_bed_temp_to_trigger: 55.0
variable_min_print_minutes_to_trigger: 5.0

# -- Nozzle temperature during soak ------------------------------------------
# Low enough to avoid ooze, high enough for a probe that needs some heat.
# Set to 0 to leave nozzle cold during soak.
variable_soak_nozzle_temp: 150.0

# -- Fans during soak ---------------------------------------------------------
# The part cooling fan ([fan] type) does NOT support SET_FAN_SPEED and must be
# controlled separately via M106/M107.
# Speed 0.0-1.0. Set to 0.0 to leave the part fan off during soak.
variable_soak_part_fan_speed: 0.0

# [fan_generic] fans only -- use SET_FAN_SPEED. Fan names must match exactly as
# defined in printer.cfg. Speed is 0.0-1.0. All listed fans are zeroed when
# soak ends -- PRINT_START_BASE takes over fan control for the print.
# Set to [] to leave all generic fans untouched during soak.
# On enclosed printers, running circulation fans during soak helps distribute
# heat evenly through the chamber and speeds up thermal stabilisation.
# Examples:
#   Nevermore filter: [["nevermore", 1.0]]
#   SV0-style:        [["fan2", 0.5], ["fan3", 0.0]]
#   Multiple:         [["nevermore", 1.0], ["exhaust", 0.0]]
# NOTE: Klipper requires this to be on a single line.
variable_soak_fans: []

# -- Park position ------------------------------------------------------------
# Z height to park at during soak.
variable_park_z: 10.0

# -- Heat-up popup refresh -----------------------------------------------------
# How often (seconds) the popup redraws with live bed/nozzle temp while
# heating up, before the real soak countdown starts. Each redraw resends a
# full action:prompt_begin/text/show sequence (Mainsail/Fluidd's popup
# protocol has no partial-update command), which rebuilds the whole dialog
# every time -- too short and it visibly flashes/disappears faster than you
# can read the new number (found live: 2s and 4s both too fast, 30s good).
variable_heatup_tick_interval: 30.0

gcode:
    # Config-only macro -- never call directly.


# =============================================================================
#  USER HOOK: PRINTER_HEATSOAK_PARK  --  MACROS TO RUN DURING THE HEATSOAK
# =============================================================================
#  This is where you put ANY task you want to happen during the soak window --
#  called exactly once, right when the bed reaches target temp (see the HEATUP
#  TICK BRANCH in PRINT_START), at the same moment the soak countdown itself
#  starts. It does NOT gate or delay the countdown -- the deadline is already
#  set before this runs, so whatever this macro takes to execute is simply
#  absorbed into however much of the soak window is left, not stacked after
#  it. If this macro alone takes longer than the whole configured soak
#  duration, the print resumes the moment it finishes (see PRINT_START's
#  IS_TICK branch) -- no extra wait tacked on either way.
#
#  Nozzle temp during the soak is already handled separately by _HEATSOAK_PREP
#  (a plain M104 to _HEATSOAK_CFG.soak_nozzle_temp, fired non-blocking
#  alongside the bed at soak start) -- you do NOT need to heat/wait for the
#  nozzle here for that baseline behavior. Only add your own M104/M109 (or
#  SET_HEATER_TEMPERATURE/TEMPERATURE_WAIT) below if a specific task needs a
#  DIFFERENT temp than the soak standby, or needs to guarantee it's actually
#  reached before proceeding -- write it to manage its own heating/waiting
#  internally rather than relying on this hook having already gated on a
#  particular temp, since it doesn't (a real toolchanger's tool-offset
#  calibration macro on this pattern turned out to already need this --
#  CALIBRATE_TOOL_OFFSETS and KOMB both handle their own M104/M109 or
#  SET_HEATER_TEMPERATURE/TEMPERATURE_WAIT internally for exactly this
#  reason). This also means the popup cannot visibly update WHILE this macro
#  is running (Klipper only runs one gcode script at a time -- see the HEATUP
#  TICK BRANCH's own comment in PRINT_START for the full mechanism) -- it'll
#  hold whatever it last showed, then correct itself a moment after this
#  macro returns.
#
#  DEFAULT (most machines): just park at bed center, nothing else -- this is
#  what "the soak" means with no extra tasks: sit still and let the bed/frame
#  come up to temperature.
#
#  OTHER EXAMPLES (uncomment / adapt as needed for your machine):
#    * Run circulation fans harder during the soak than _HEATSOAK_CFG.soak_fans
#      already sets, or run a fan ONLY once parked (e.g. to avoid blowing on
#      the bed while it's still climbing to temp):
#        SET_FAN_SPEED FAN=nevermore SPEED=1.0
#    * Toolchanger/MMU: preheat and calibrate every tool that'll be used this
#      print instead of just the active one -- each tool-select macro should
#      manage its own heating internally, matching the KOMB/CALIBRATE_TOOL_
#      OFFSETS pattern described above, rather than assuming a shared preheat
#      already happened:
#        {% for t in [0, 1, 2] %}
#            SELECT_TOOL T={t}
#            YOUR_TOOL_CALIBRATION_MACRO
#        {% endfor %}
#    * Bed mesh prep that's safe to do cold/warm (not the final hot mesh --
#      that still belongs in PRINT_START_BASE after the soak, per the
#      standing "re-home/level/mesh must happen hot, after the soak"
#      requirement elsewhere in this file):
#        QUAD_GANTRY_LEVEL   ; a rough pre-soak level, refined again hot later
#    * Anything genuinely one-time and slow that doesn't need bed heat at all
#      (a nozzle-clean routine, a filament-runout sensor self-test, etc.) --
#      this hook is a generic "run stuff during the dead time" slot, not
#      specific to any one use case.
# =============================================================================

[gcode_macro PRINTER_HEATSOAK_PARK]
description: Tasks to run during the heatsoak (default: just park). Override to add more -- see the block comment above for real examples and the self-heating caveat.
gcode:
    {% set cfg = printer["gcode_macro _HEATSOAK_CFG"] %}

    # ---- CUSTOMISE FROM HERE: add your own tasks above this park move ----

    # ---- END CUSTOMISE ----

    {% if printer.toolhead.homed_axes|lower == "xyz" %}
        {% set cx = (printer.toolhead.axis_maximum.x|float) / 2.0 %}
        {% set cy = (printer.toolhead.axis_maximum.y|float) / 2.0 %}
        G90
        G1 Z{cfg.park_z} F1800
        G1 X{cx} Y{cy} F6000
    {% endif %}


# =============================================================================
#  STARTUP CLEANUP
#  Any heatsoak_active/state left over from before a restart is guaranteed
#  stale: the delayed_gcode timer chain (_HEATSOAK_UPDATE/_HEATSOAK_PREP) that
#  drives a soak's countdown does NOT survive a Klipper restart, so an
#  "active" session found at startup can never be a real, continuable soak --
#  it's orphaned state from whatever interrupted the previous session
#  (crash, manual restart) before its own cleanup ran.
# =============================================================================

[delayed_gcode _HEATSOAK_STARTUP_CLEAR]
initial_duration: 2
gcode:
    {% set st = printer["gcode_macro PRINT_START"] %}
    {% if st.heatsoak_active or (st.state and (st.state|string) != "{}") %}
        RESPOND TYPE=echo MSG="Heatsoak: clearing stale active state left over from before this restart"
        SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=heatsoak_active VALUE=0
        SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=state VALUE="{{}}"
    {% endif %}
    # Self-check: is _HEATSOAK_CANCEL_TEARDOWN hooked into the live
    # CANCEL_PRINT, and is no old copy of this file's former CANCEL_PRINT
    # wrapper merged in? See the CANCEL TEARDOWN section near the bottom.
    # Accepted hookup spots: CANCEL_PRINT's own gcode, mainsail/fluidd
    # client.cfg's variable_user_cancel_macro, RatOS's
    # _USER_END_PRINT_BEFORE_HEATERS_OFF / _END_PRINT_BEFORE_HEATERS_OFF
    # (RatOS's CANCEL_PRINT calls END_PRINT, which calls both), or
    # Happy Hare's _MMU_CLIENT_VARS variable_user_cancel_extension.
    {% set sets = printer.configfile.settings %}
    {% set cp = sets.get("gcode_macro cancel_print", {}) %}
    {% set hook_text = (cp.get("gcode", "")|string ~ " " ~ cp.get("variable_user_cancel_macro", "")|string ~ " "
        ~ sets.get("gcode_macro _end_print_before_heaters_off", {}).get("gcode", "")|string ~ " "
        ~ sets.get("gcode_macro _user_end_print_before_heaters_off", {}).get("gcode", "")|string ~ " "
        ~ sets.get("gcode_macro _mmu_client_vars", {}).get("variable_user_cancel_extension", "")|string)|upper %}
    {% if not cp %}
        RESPOND TYPE=error MSG="Heatsoak: no [gcode_macro CANCEL_PRINT] found -- add one that calls _HEATSOAK_CANCEL_TEARDOWN (see heatsoak file)"
    {% elif (cp.get("rename_existing", "")|string|upper) == "HEATSOAK_TRUE_CANCEL_PRINT" %}
        RESPOND TYPE=error MSG="Heatsoak: an OLD heatsoak CANCEL_PRINT wrapper is still merged in and is replacing your printer's real cancel -- remove/comment it (see CHANGELOG 2026-10-02)"
    {% elif "_HEATSOAK_CANCEL_TEARDOWN" not in hook_text %}
        RESPOND TYPE=error MSG="Heatsoak: your CANCEL_PRINT does not call _HEATSOAK_CANCEL_TEARDOWN -- a cancel during a soak will leave soak timers running"
    {% endif %}
    # Same check for the RESUME hookup (see the RESUME CHECK section).
    {% set rs = sets.get("gcode_macro resume", {}) %}
    {% set resume_hook_text = (rs.get("gcode", "")|string ~ " "
        ~ sets.get("gcode_macro _client_variable", {}).get("variable_user_resume_macro", "")|string ~ " "
        ~ sets.get("gcode_macro _mmu_client_vars", {}).get("variable_user_resume_extension", "")|string)|upper %}
    {% if "_HEATSOAK_RESUME_CHECK" not in resume_hook_text %}
        RESPOND TYPE=error MSG="Heatsoak: your RESUME does not call _HEATSOAK_RESUME_CHECK -- pressing Resume during a soak would start the print on an unsoaked bed (see heatsoak file)"
    {% endif %}


# =============================================================================
#  PHYSICAL PREP  --  fires via delayed_gcode so popup appears first
# =============================================================================

[delayed_gcode _HEATSOAK_PREP]
gcode:
    {% set st  = printer["gcode_macro PRINT_START"] %}
    {% set cfg = printer["gcode_macro _HEATSOAK_CFG"] %}

    {% if st.state and (st.state|string) != "{}" and st.heatsoak_active %}
        {% set bed = st.state.get("bed", 60)|float %}

        # Start bed AND nozzle heating together, both non-blocking. These used to
        # be sequenced (nozzle heat only started once bed_ready) -- see the
        # 2026-09-14 CHANGELOG entry for why that was wrong even for machines
        # with no extra PRINTER_HEATSOAK_PARK tasks: it just added a needless
        # wait for no reason, since neither heater depends on the other.
        M140 S{bed}
        {% if cfg.soak_nozzle_temp|float > 0 %}
            M104 S{cfg.soak_nozzle_temp|int}
        {% endif %}

        {% set soak_timeout = (cfg.soak_max_seconds|float + 600)|int %}
        SET_IDLE_TIMEOUT TIMEOUT={soak_timeout}

        # Set generic fans (fan_generic type -- SET_FAN_SPEED)
        {% for fan_entry in cfg.soak_fans %}
            SET_FAN_SPEED FAN={fan_entry[0]} SPEED={fan_entry[1]}
        {% endfor %}

        # Part cooling fan (fan type -- M106/M107 only)
        {% if cfg.soak_part_fan_speed|float > 0 %}
            M106 S{(cfg.soak_part_fan_speed|float * 255)|int}
        {% else %}
            M107
        {% endif %}

        # Home if needed
        {% if printer.toolhead.homed_axes|lower != "xyz" %}
            G28
        {% endif %}

        # Bed/nozzle wait is a non-blocking POLL heartbeat, not M190/M109 --
        # see the 2026-08-31 CHANGELOG entry for why: Klipper serializes ALL
        # gcode script execution through a single mutex
        # (klippy/gcode.py GCodeDispatch.run_script()'s `with self.mutex:`,
        # held for the whole duration of a blocking call like M190/M109).
        # A separate delayed_gcode's TIMER can still fire during that wait,
        # but the gcode it tries to run queues on that same mutex and
        # doesn't actually execute until the blocking script finishes --
        # so a heartbeat trying to update the popup DURING M190 is silently
        # deferred until AFTER it, making it useless for live progress.
        # Confirmed by reading klippy/reactor.py's ReactorMutex directly,
        # and live: the popup never updated once during a real ~7-minute
        # bed heat-up test (zero prompt messages logged the whole window).
        # Polling instead sidesteps the mutex entirely -- each tick is its
        # own independent, always-completing script, so it can safely show
        # live temps and re-arm itself. See the HEATUP TICK BRANCH below,
        # which owns the actual wait/park/countdown-handoff now.
        UPDATE_DELAYED_GCODE ID=_HEATSOAK_HEATUP_TICK DURATION=1
    {% endif %}


# =============================================================================
#  PAUSE GUARD  --  verifies the soak's pause actually stopped the print
#  Armed 1s after INIT's pause call. If the soak is active but virtual_sdcard
#  is still reading the file, the pause did NOT take (stale pause flag, wrong
#  macro name, anything) and the real print body is running underneath the
#  popup on unready heaters. Abort loudly rather than let that continue.
#  A file-reading pause stops virtual_sdcard right after PRINT_START returns,
#  so by the time this fires a working pause always reads is_active = False.
#  If a blocking command in the file (M190/M109) holds the gcode mutex, this
#  runs as soon as that finishes -- later, but before the print gets far.
# =============================================================================

[delayed_gcode _HEATSOAK_PAUSE_GUARD]
gcode:
    {% set st = printer["gcode_macro PRINT_START"] %}
    {% if st.heatsoak_active and printer.virtual_sdcard is defined and printer.virtual_sdcard.is_active %}
        RESPOND TYPE=error MSG="Heatsoak: the soak's PAUSE did not stop the print (file still running) -- cancelling to protect the print. Check the console for 'Print already paused'."
        CANCEL_PRINT
    {% endif %}


# =============================================================================
#  COUNTDOWN HEARTBEAT
# =============================================================================

[delayed_gcode _HEATSOAK_UPDATE]
gcode:
    UPDATE_DELAYED_GCODE ID=_HEATSOAK_UPDATE DURATION=0
    {% set st = printer["gcode_macro PRINT_START"] %}
    {% if st.state and (st.state|string) != "{}" and st.heatsoak_active %}
        {% if printer.print_stats.state in ["cancelled", "error", "complete"] %}
            # Print already ended without the soak being torn down (some
            # cancel path skipped _HEATSOAK_CANCEL_TEARDOWN) -- clean up
            # instead of ticking on forever. See CHANGELOG 2026-10-02.
            _HEATSOAK_CANCEL_TEARDOWN
        {% else %}
            PRINT_START TICK=1
        {% endif %}
    {% endif %}


# =============================================================================
#  HEATING PROGRESS HEARTBEAT
#  Ticks while the bed/nozzle are still heating, before the real soak
#  countdown starts, so the popup shows live temp progress instead of a
#  frozen "Soak remaining" value that looks stuck for however long heating
#  takes. Self-cancels once _HEATSOAK_PREP flips state.heating to false.
# =============================================================================

[delayed_gcode _HEATSOAK_HEATUP_TICK]
gcode:
    UPDATE_DELAYED_GCODE ID=_HEATSOAK_HEATUP_TICK DURATION=0
    {% set st = printer["gcode_macro PRINT_START"] %}
    {% if st.state and (st.state|string) != "{}" and st.heatsoak_active %}
        {% if printer.print_stats.state in ["cancelled", "error", "complete"] %}
            # Print already ended without the soak being torn down (some
            # cancel path skipped _HEATSOAK_CANCEL_TEARDOWN) -- clean up
            # instead of ticking on forever. See CHANGELOG 2026-10-02.
            _HEATSOAK_CANCEL_TEARDOWN
        {% else %}
            PRINT_START HEATUP_TICK=1
        {% endif %}
    {% endif %}


# =============================================================================
#  PRINT_START  --  main entry point called by slicer
#  (rename this + all internal self-references to match your slicer profile
#  if it calls something else, e.g. HEATSOAK -- see the Voron 0 deployment
#  for an example of a pure rename with no logic changes)
#
#  Slicer call:
#    PRINT_START BED={bed_temperature} EXTRUDER={temperature}
#
#  Internal calls (do not use manually):
#    PRINT_START TICK=1        -- heartbeat tick
#    PRINT_START SKIP=1        -- user pressed Skip
#    PRINT_START CANCEL=1      -- user pressed Cancel
#    PRINT_START ADJUST=<+/->  -- user adjusted time (minutes)
#
# =============================================================================

[gcode_macro PRINT_START]
variable_state: {}
variable_heatsoak_active: 0

gcode:
    {% set SELF      = "PRINT_START" %}
    {% set IS_TICK   = params.TICK|default(0)|int %}
    {% set IS_SKIP   = params.SKIP|default(0)|int %}
    {% set IS_CANCEL = params.CANCEL|default(0)|int %}
    {% set IS_ADJUST = "ADJUST" in params %}
    {% set IS_HEATUP_TICK = params.HEATUP_TICK|default(0)|int %}
    {% set IS_INIT   = not IS_TICK and not IS_SKIP and not IS_CANCEL and not IS_ADJUST and not IS_HEATUP_TICK %}

    {% set cfg    = printer["gcode_macro _HEATSOAK_CFG"] %}
    {% set state  = printer["gcode_macro PRINT_START"].state %}
    {% set active = printer["gcode_macro PRINT_START"].heatsoak_active %}

    # ── Shared Jinja helpers ──────────────────────────────────────────────────

    {%- macro format_time(sec) -%}
        {%- set s  = sec|int(0) -%}
        {%- set h  = s // 3600 -%}
        {%- set m  = (s % 3600) // 60 -%}
        {%- set s2 = s % 60 -%}
        {%- set parts = [] -%}
        {%- if h -%}{%- set _ = parts.append(h ~ "h") -%}{%- endif -%}
        {%- if m -%}{%- set _ = parts.append(m ~ "m") -%}{%- endif -%}
        {%- set _ = parts.append(s2 ~ "s") -%}
        { parts[0:2]|join(" ") }
    {%- endmacro -%}

    {%- macro get_chamber_temp(sensor_suffix) -%}
        {%- set result = [] -%}
        {%- if sensor_suffix|trim -%}
            {%- for h in printer.heaters.available_sensors -%}
                {%- if (h|lower).endswith(sensor_suffix|trim|lower) and not result -%}
                    {%- set _ = result.append(printer[h].temperature) -%}
                {%- endif -%}
            {%- endfor -%}
        {%- endif -%}
        { result[0] if result else "" }
    {%- endmacro -%}

    # NOTE: the comment explaining the (?![a-zA-Z]) lookahead below is
    # deliberately OUTSIDE the macro body (before {%- macro -%}, not inside
    # it) -- any literal text inside a Jinja {%- macro -%}...{%- endmacro -%}
    # block becomes part of that macro's returned value, which would corrupt
    # its numeric result. See CHANGELOG at the top of this file for why this
    # lookahead matters: without it, "3dbenchy...0.25mm...2h20m.gcode" reads
    # "3d" as 3 days and "25m" (from "0.25mm") as 25 minutes.
    {%- macro get_duration_from_name(fname) -%}
        {%- set glob     = printer.printer.__class__.__init__.__globals__ -%}
        {%- set re       = glob.importlib.import_module("re") -%}
        {%- set unit_map = {"d": 86400, "h": 3600, "m": 60, "s": 1} -%}
        {%- set matches  = re.findall("([0-9]+)([dhms])(?![a-zA-Z])", fname|string) -%}
        {%- set durations = [] -%}
        {%- for num, unit in matches if unit in unit_map -%}
            {%- set _ = durations.append(num|float * unit_map[unit]) -%}
        {%- endfor -%}
        { durations|sum if durations else -1 }
    {%- endmacro -%}

    {%- macro polygon_area(poly) -%}
        {%- set n  = poly|length -%}
        {%- set ns = namespace(acc=0) -%}
        {%- for point in poly -%}
            {%- set j      = (loop.index0 + 1) % n -%}
            {%- set ns.acc = ns.acc + (point[0] * poly[j][1] - poly[j][0] * point[1]) -%}
        {%- endfor -%}
        { (ns.acc / 2.0)|abs }
    {%- endmacro -%}

    {%- macro max_polygon_area(objs) -%}
        {%- set areas = [] -%}
        {%- for p in objs|map(attribute="polygon") -%}
            {%- set _ = areas.append(polygon_area(p)) -%}
        {%- endfor -%}
        { areas|map("float")|list|max if areas else 0 }
    {%- endmacro -%}

    # Renders a real SVG outline of every excluded-object polygon on the bed
    # and sends it as a BARE action_respond_info() call -- deliberately NOT
    # wrapped in the ui()/action:prompt_ helper below, which is a separate,
    # text/button-only protocol that cannot carry markup. Ported from
    # Contomo's original (github.com/Contomo/klipper-questionable-macros,
    # macro-examples/interruptable_heatsoak_print_start.cfg, PART_AREA
    # macro) after checking his real source instead of guessing -- his
    # version does exactly this (raw SVG string straight into a bare
    # action_respond_info), which Mainsail's/Fluidd's console tab renders
    # inline. This is a different UI surface than the popup dialog (which
    # only speaks action:prompt_* and genuinely cannot show it) -- open the
    # Console tab, not the popup, to see it. Called once per soak, not on
    # every tick, since the layout doesn't change mid-soak.
    #
    # NEVER use hex colors (#rrggbb) or any other literal '#' anywhere in
    # this macro's SVG string output, or anywhere else in a gcode_macro body
    # in ANY .cfg Klipper loads -- confirmed live via a real deploy failure:
    # Klipper's config-file reader (configfile.py's ConfigFileReader,
    # both append_fileconfig() and _parse_config()) does
    # `pos = line.find('#'); line = line[:pos]` on EVERY raw line of the
    # file, UNCONDITIONALLY, before configparser or Jinja ever see it -- with
    # zero awareness of quoting. A hex color inside a quoted string gets
    # silently truncated mid-line along with everything after it, corrupting
    # the template and producing a confusing downstream Jinja
    # TemplateSyntaxError (e.g. "expected token ',', got 'x'") that points
    # nowhere near the real cause. This is exactly why Contomo's original
    # PART_AREA macro uses named CSS colors ('cyan'/'gray'/'black'/'white')
    # instead of hex -- not a style choice, a hard requirement. Named colors
    # only, here and in any future edit to this file.
    {%- macro draw_buildplate_layout_svg(objs, w, h, pad=10) -%}
        {%- set total_w = (w + pad * 2) -%}
        {%- set total_h = (h + pad * 2) -%}
        {%- set svg_parts = [] -%}
        {%- set _ = svg_parts.append('<svg xmlns="http://www.w3.org/2000/svg" width="' ~ total_w|round(0) ~ '" height="' ~ total_h|round(0) ~ '" viewBox="0 0 ' ~ total_w|round(0) ~ ' ' ~ total_h|round(0) ~ '" style="background-color:black;">') -%}
        {%- set _ = svg_parts.append('<rect x="' ~ pad ~ '" y="' ~ pad ~ '" width="' ~ w ~ '" height="' ~ h ~ '" fill="none" stroke="white" stroke-width="1" />') -%}
        {%- for obj in objs -%}
            {%- set pts = [] -%}
            {%- for p in obj.polygon -%}
                {%- set xv = (p[0] + pad)|round(2) -%}
                {%- set yv = (h - p[1] + pad)|round(2) -%}
                {%- set _ = pts.append(xv|string ~ "," ~ yv|string) -%}
            {%- endfor -%}
            {%- set _ = svg_parts.append('<polygon points="' ~ pts|join(" ") ~ '" stroke="cyan" fill="gray" stroke-width="1" />') -%}
        {%- endfor -%}
        {%- set _ = svg_parts.append("</svg>") -%}
        { svg_parts|join("") }
    {%- endmacro -%}

    {%- macro ui(msg)  -%}{ action_respond_info("action:prompt_" ~ msg) }{%- endmacro -%}
    {%- macro add(msg) -%}{ ui(msg) }{ ui("show") }{%- endmacro -%}

    {%- macro show_ui(soak_left) -%}
        {% set ps = printer.print_stats %}
        { ui("begin Heatsoak -- " ~ (ps.filename.split("_")[0]|default("next print"))) }
        { ui("text Print file: " ~ (ps.filename|default("unknown")|string)) }
        {% set pdur = state.get("print_dur_sec", 0)|int %}
        {% if pdur > 0 %}
            { ui("text Print duration: " ~ format_time(pdur)) }
        {% else %}
            { ui("text Print duration: Unknown") }
        {% endif %}
        {% if state.get("heating", false) %}
            { ui("text Bed: " ~ (printer.heater_bed.temperature|round(1)) ~ "C / " ~ (state.get("bed", 0)|int) ~ "C") }
            {% if cfg.soak_nozzle_temp|float > 0 %}
                { ui("text Nozzle: " ~ (printer.extruder.temperature|round(1)) ~ "C / " ~ (cfg.soak_nozzle_temp|int) ~ "C") }
            {% endif %}
            { ui("text Soak: " ~ format_time(soak_left|int) ~ " once bed is heated") }
        {% else %}
            { ui("text Soak remaining: " ~ format_time(soak_left|int)) }
            { ui("text Bed target: " ~ (state.get("bed", 0)|int)|string ~ "C") }
            # Soak nozzle temp is _HEATSOAK_CFG.soak_nozzle_temp; state.noz is the
            # slicer's PRINT temp (used after the soak). This line used to label
            # the print temp "standby", which read as a wrong/too-high value.
            { ui("text Nozzle during soak: " ~ (((cfg.soak_nozzle_temp|int)|string ~ "C") if cfg.soak_nozzle_temp|float > 0 else "off")) }
            { ui("text Nozzle for print: " ~ (state.get("noz", 0)|int)|string ~ "C") }
        {% endif %}
        {% if cfg.chamber_sensor|trim %}
            {% set ctemp = get_chamber_temp(cfg.chamber_sensor) %}
            {% if ctemp %}
                {% set chamber_target = state.get("chamber_target", 0)|float %}
                {% if chamber_target > 0 %}
                    { ui("text Chamber: " ~ (ctemp|float)|round(1)|string ~ "C / " ~ chamber_target|int|string ~ "C target") }
                {% else %}
                    { ui("text Chamber: " ~ (ctemp|float)|round(1)|string ~ "C") }
                {% endif %}
            {% endif %}
        {% endif %}
        {% if printer.exclude_object is defined and printer.exclude_object.objects %}
            {% set area_cm2 = (max_polygon_area(printer.exclude_object.objects)|float / 100.0)|int %}
            { ui("text Largest part area: " ~ area_cm2|string ~ " cm2") }
        {% endif %}
        { ui("button_group_start") }
        {% for step in [15, 10, 5, -15, -10, -5] %}
            { ui("button " ~ ("+" ~ step|string if step > 0 else step|string) ~ " min|" ~ SELF ~ " ADJUST=" ~ step ~ "|accent--text text--" ~ ("lighten" if step > 0 else "darken") ~ "-3") }
        {% endfor %}
        { ui("button_group_end") }
        { ui("footer_button [ X ] Cancel Print|" ~ SELF ~ " CANCEL=1|error") }
        { add("footer_button [ > ] Skip Heatsoak|" ~ SELF ~ " SKIP=1|success") }
    {%- endmacro -%}

    {%- macro zero_soak_fans() -%}
        {% for fan_entry in cfg.soak_fans %}
            SET_FAN_SPEED FAN={fan_entry[0]} SPEED=0
        {% endfor %}
        M107
    {%- endmacro -%}

    # Soak time is tracked as an ABSOLUTE deadline (state.soak_deadline, in
    # toolhead.estimated_print_time seconds -- a real wall-clock-derived reading that
    # keeps advancing through PAUSE/heating/PRINTER_HEATSOAK_PARK, unlike
    # print_stats.total_duration which freezes while paused) rather than a
    # decrementing counter -- set once the bed reaches target temp (see the HEATUP
    # TICK BRANCH below), not at INIT. Soaking is specifically about holding the
    # frame/gantry hot once the bed is at temperature, so the soak duration itself
    # (state.soak_total, the raw seconds decided at INIT) always runs in full
    # starting from that moment -- bed heat-up time is never subtracted from it.
    # PRINTER_HEATSOAK_PARK (your "tasks during the heatsoak" hook) runs immediately
    # AFTER the deadline is set, in the same tick, rather than gating the countdown
    # behind it -- so however long it takes IS counted against the already-running
    # deadline. If it alone runs past the deadline, remaining() reads 0 the moment
    # a fresh tick checks it (see the HEATUP TICK BRANCH's own comment for exactly
    # why this can't be checked synchronously within the same call as the hook
    # itself -- a real Klipper macro-execution constraint, not a design choice) and
    # the branch resumes right there, no separate countdown wait tacked on
    # afterward. remaining() is only meaningful once soak_deadline exists (i.e.
    # once the bed is ready); before that, callers show state.soak_total directly
    # (a fixed value, not counting down).
    {%- macro remaining() -%}
        { [state.get("soak_deadline", 0)|float - printer.toolhead.estimated_print_time|float, 0.0]|max }
    {%- endmacro -%}

    # 2026-08-27 (beta), rewritten after a live test caught a real bug:
    # checking `printer["gcode_macro BASE_PAUSE"] is defined` NEVER works for
    # PAUSE/RESUME, because rename_existing on a command backed by
    # pause_resume.py (not a plain [gcode_macro X] section) registers the new
    # name as a callable gcode command but does NOT create a queryable
    # `gcode_macro <name>` status object -- confirmed live: /printer/objects/
    # list never listed gcode_macro BASE_PAUSE even though /printer/gcode/
    # help showed it as a real command, and a real HEATSOAK call hard-errored
    # on this exact check every time. Read the CONFIGURED rename_existing
    # value directly instead, via printer.configfile.settings -- confirmed
    # live this returns {'rename_existing': 'BASE_PAUSE', ...} for
    # [gcode_macro pause]. Same fix applied to the RESUME side below (not yet
    # separately live-tested, but identical mechanism -- pause_resume.py
    # backs both PAUSE and RESUME the same way).
    {%- macro _resolve_pause_macro() -%}
        {%- set pause_cfg = printer.configfile.settings["gcode_macro pause"]|default({}) -%}
        {%- if pause_cfg.rename_existing -%}
            { pause_cfg.rename_existing }
        {%- else -%}
            {%- set _ = action_raise_error("Heatsoak: [gcode_macro PAUSE] has no rename_existing configured on this printer -- the real pause has nothing to call") -%}
        {%- endif -%}
    {%- endmacro -%}

    {%- macro _resolve_resume_macro() -%}
        {%- set resume_cfg = printer.configfile.settings["gcode_macro resume"]|default({}) -%}
        {%- if resume_cfg.rename_existing -%}
            { resume_cfg.rename_existing }
        {%- else -%}
            {%- set _ = action_raise_error("Heatsoak: [gcode_macro RESUME] has no rename_existing configured on this printer -- the real resume has nothing to call") -%}
        {%- endif -%}
    {%- endmacro -%}

    {%- macro resume_and_start() -%}
        UPDATE_DELAYED_GCODE ID=_HEATSOAK_UPDATE DURATION=0
        UPDATE_DELAYED_GCODE ID=_HEATSOAK_PAUSE_GUARD DURATION=0
        { ui("end") }
        SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=heatsoak_active VALUE=0
        { zero_soak_fans() }
        {% if printer.pause_resume.is_paused %}
            RESTORE_GCODE_STATE NAME=HEATSOAK_STATE MOVE=0
            SAVE_GCODE_STATE NAME=PAUSE_STATE
            { _resolve_resume_macro() }
        {% endif %}
        {action_respond_info("Heatsoak complete -- calling PRINT_START_BASE")}
        # EXTRUSION_MODE_RESET (2026-10-05): start the printer's own sequence in
        # relative extrusion with E zeroed, whatever ran before (a filament load
        # can leave M82). The slicer's own M83 only comes after this.
        M83
        G92 E0
        # Decoded named fields, NOT the raw rawparams string -- see
        # CHANGELOG at the top of this file. Add/remove named params here to
        # match whatever your slicer profile actually passes.
        PRINT_START_BASE BED={state.get("bed", 60)|int} EXTRUDER={state.get("noz", 200)|int} LAYER={state.get("layer", "")} FILAMENT={state.get("filament", "")} EXCLUDE={state.get("exclude", "")} SURFACE="{state.get('surface', '')}" OAPA={state.get("oapa", "")} DMGCC="{state.get('dmgcc', '')}"
        {% set _ = state.clear() %}
    {%- endmacro -%}

    # =========================================================================
    #  ADJUST BRANCH
    # =========================================================================
    {% if IS_ADJUST %}
        {% if state and (state|string) != "{}" and active %}
            {% set delta = params.ADJUST|float * 60.0 %}
            {% if state.get("heating", false) %}
                # Still waiting on the bed -- no deadline exists yet, so adjust the
                # total soak duration itself (what the deadline will be computed from
                # once the bed IS ready), not a not-yet-existent countdown.
                {% set newleft = [[state.get("soak_total", 0)|float + delta, 0]|max,
                                   cfg.soak_max_seconds|float]|min %}
                {% set _ = state.update({"soak_total": newleft}) %}
            {% else %}
                {% set now     = printer.toolhead.estimated_print_time|float %}
                {% set newleft = [[remaining()|float + delta, 0]|max,
                                   cfg.soak_max_seconds|float]|min %}
                {% set _ = state.update({"soak_deadline": now + newleft}) %}
            {% endif %}
            SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=state VALUE="{state}"
            { show_ui(newleft|int) }
            {% if not state.get("heating", false) %}
                UPDATE_DELAYED_GCODE ID=_HEATSOAK_UPDATE DURATION=0.2
            {% endif %}
        {% else %}
            {action_respond_info("Heatsoak ADJUST ignored: no active soak")}
        {% endif %}

    # =========================================================================
    #  SKIP BRANCH
    # =========================================================================
    {% elif IS_SKIP %}
        {% if state and (state|string) != "{}" and active %}
            {action_respond_info("Heatsoak SKIP: proceeding to print")}
            { resume_and_start() }
        {% else %}
            {action_respond_info("Heatsoak SKIP ignored: no active soak")}
        {% endif %}

    # =========================================================================
    #  CANCEL BRANCH
    # =========================================================================
    {% elif IS_CANCEL %}
        {% if state and (state|string) != "{}" and active %}
            {action_respond_info("Heatsoak CANCEL")}
            UPDATE_DELAYED_GCODE ID=_HEATSOAK_UPDATE DURATION=0
            UPDATE_DELAYED_GCODE ID=_HEATSOAK_PREP DURATION=0
            UPDATE_DELAYED_GCODE ID=_HEATSOAK_HEATUP_TICK DURATION=0
            UPDATE_DELAYED_GCODE ID=_HEATSOAK_PAUSE_GUARD DURATION=0
            { ui("end") }
            SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=heatsoak_active VALUE=0
            { zero_soak_fans() }
            RESTORE_GCODE_STATE NAME=HEATSOAK_STATE MOVE=0
            SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=state VALUE="{{}}"
            CANCEL_PRINT
        {% else %}
            {action_respond_info("Heatsoak CANCEL ignored: no active soak")}
        {% endif %}

    # =========================================================================
    #  HEATUP TICK BRANCH  --  non-blocking bed heat-wait poll, with live popup
    #  updates. Replaces M190 (see 2026-08-31 CHANGELOG and the comment in
    #  _HEATSOAK_PREP) -- each tick independently checks bed temp against
    #  target and either re-arms itself (still heating) or, once ready, starts
    #  the soak deadline and hands off to PRINTER_HEATSOAK_PARK. Tolerance is
    #  intentionally looser than Klipper's own PID-settle wait (which also
    #  checks the temperature's rate of change, not just its value) -- close
    #  enough for a pre-print soak target, not worth replicating exactly here.
    #  Tick interval is cfg.heatup_tick_interval (default 30s), not something
    #  shorter -- each show_ui() call resends a full
    #  action:prompt_begin/text/show sequence (Mainsail's popup protocol has
    #  no partial-update command), which rebuilds the whole dialog every time.
    #  At 2s that rebuild was fast enough to make the popup visibly
    #  flash/disappear before you could read the new number; 4s was still too
    #  fast to read comfortably (both found live 2026-08-31) -- 30s gives
    #  plenty of time to actually read it. Edit _HEATSOAK_CFG.
    #  heatup_tick_interval, not this branch, to change it.
    #
    #  2026-09-14 -- this branch used to also gate on the nozzle reaching
    #  cfg.soak_nozzle_temp before running PRINTER_HEATSOAK_PARK, checked
    #  bed-then-nozzle sequentially (nozzle heat command wasn't even issued
    #  until the bed finished). Both were wrong on a real toolchanger: nozzle
    #  heat now fires in parallel with the bed back in _HEATSOAK_PREP, and
    #  PRINTER_HEATSOAK_PARK doesn't need to wait on ANY heater here at all --
    #  a real per-tool calibration macro on this pattern needed its own
    #  M104/M109 regardless (see the USER HOOK section above), so gating on a
    #  generic nozzle-ready check just added a redundant wait for no benefit.
    #  Bed is now the ONLY gate -- soaking is specifically about holding the
    #  frame/gantry hot once the bed is at temperature.
    # =========================================================================
    {% elif IS_HEATUP_TICK %}
        {% if state and (state|string) != "{}" and active and state.get("heating", false) %}
            {% set bed_target = state.get("bed", 0)|float %}
            {% set bed_ready  = printer.heater_bed.temperature >= (bed_target - 1.0) %}

            {% if not bed_ready %}
                { show_ui(state.get("soak_total", 0)|float|int) }
                UPDATE_DELAYED_GCODE ID=_HEATSOAK_HEATUP_TICK DURATION={cfg.heatup_tick_interval}
            {% else %}
                # Start the soak clock right now, for the FULL configured duration --
                # fixed, independent of whatever PRINTER_HEATSOAK_PARK below takes --
                # and only then run it, in the same breath, instead of gating the
                # countdown behind it.
                #
                # IMPORTANT Klipper constraint (verified against
                # klippy/extras/gcode_macro.py's GetStatusWrapper): a gcode_macro's
                # ENTIRE Jinja template renders into one flat gcode string up front --
                # printer.toolhead.estimated_print_time is read once and CACHED for
                # every reference within that one render -- and only after the whole
                # string is produced does Klipper dispatch it for real, line by line,
                # which is when real time actually elapses. That means a Jinja-level
                # "how much time did that take" check placed after PRINTER_HEATSOAK_
                # PARK in THIS SAME template call cannot see its real duration -- it
                # evaluates before that macro ever runs for real, not after. So there
                # is no same-call "resume instantly the moment it finishes" branch
                # here; that would be dead code that always reads a noticeably
                # positive remaining time regardless of how long the hook actually
                # took. It's also why the popup can't redraw live while
                # PRINTER_HEATSOAK_PARK is running -- it's committed to the string
                # before that macro's gcode even starts executing.
                #
                # What DOES work: the deadline itself is a real timestamp, set below
                # BEFORE the hook runs. Once it actually finishes and this call's
                # remaining lines execute for real, the short heartbeat armed just
                # below fires moments later as a genuinely SEPARATE macro call/render
                # -- which reads a fresh, current estimated_print_time and correctly
                # sees however long the hook actually took. That's where "resume
                # immediately if it alone ran past the deadline" actually happens --
                # a few real seconds after it returns, not synchronously with it.
                # Kept short (1s, not the usual 30s heatup_tick_interval)
                # specifically to make that gap negligible.
                {% set _ = state.update({
                    "heating":       false,
                    "soak_deadline": printer.toolhead.estimated_print_time|float + state.get("soak_total", 0)|float,
                }) %}
                SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=state VALUE="{state}"
                RESPOND TYPE=echo MSG="Heatsoak: bed at {bed_target}C. Countdown started, running heatsoak tasks now."

                # Regenerate the popup right here, at the actual moment the countdown
                # starts -- otherwise it keeps showing the old "once bed is heated"
                # heating-phase text for however long PRINTER_HEATSOAK_PARK takes,
                # which reads as stuck/stale. This is the freshest correct value
                # obtainable at this point (full soak_total, since the hook hasn't
                # run yet) -- see the comment above for why a MORE current value
                # can't be computed here, and why the 1s follow-up below is what
                # actually corrects it again once the hook's real duration is known.
                { show_ui(state.get("soak_total", 0)|float|int) }

                PRINTER_HEATSOAK_PARK
                SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=state VALUE="{state}"
                UPDATE_DELAYED_GCODE ID=_HEATSOAK_UPDATE DURATION=1
            {% endif %}
        {% endif %}

    # =========================================================================
    #  TICK BRANCH  --  heartbeat
    # =========================================================================
    {% elif IS_TICK %}
        {% if state and (state|string) != "{}" and active %}

            # -- Chamber wait check -------------------------------------------
            {% set chamber_sensor  = cfg.chamber_sensor|string|trim %}
            {% set chamber_target  = state.get("chamber_target", 0)|float %}
            {% set chamber_wait    = cfg.chamber_wait_temp|float %}
            {% set chamber_ready   = true %}

            {% if chamber_sensor and chamber_wait > 0 and chamber_target > 0 %}
                {% set ctemp_str = get_chamber_temp(chamber_sensor) %}
                {% if ctemp_str and ctemp_str|float < chamber_target %}
                    {% set chamber_ready = false %}
                {% endif %}
            {% endif %}

            {% if not chamber_ready %}
                {% set ctemp_str = get_chamber_temp(chamber_sensor) %}
                {action_respond_info("Heatsoak: waiting for chamber -- %sC / %sC target" % (
                    (ctemp_str|float)|round(1)|string, chamber_target|int|string))}
                { show_ui(remaining()|float|int) }
                UPDATE_DELAYED_GCODE ID=_HEATSOAK_UPDATE DURATION=30
            {% else %}
                {% set soak_left = remaining()|float %}

                {% if soak_left <= 0 %}
                    { resume_and_start() }
                {% else %}
                    {% if soak_left > 300 %}
                        {% set interval = 60 %}
                    {% elif soak_left > 60 %}
                        {% set interval = 30 %}
                    {% elif soak_left > 10 %}
                        {% set interval = 10 %}
                    {% else %}
                        {% set interval = 5 %}
                    {% endif %}

                    { show_ui(soak_left|int) }
                    UPDATE_DELAYED_GCODE ID=_HEATSOAK_UPDATE DURATION={interval}
                {% endif %}
            {% endif %}

        {% endif %}

    # =========================================================================
    #  INIT BRANCH  --  called by slicer
    # =========================================================================
    {% elif IS_INIT %}

        # Any pause flag at print start is stale by definition (left over
        # from a PAUSE fired while idle -- runout during a filament load,
        # UNLOAD_FILAMENT ending in PAUSE, etc.). Left set, it makes the
        # soak's pause below a silent no-op ("Print already paused") and the
        # print body runs underneath the popup. See CHANGELOG 2026-10-02.
        CLEAR_PAUSE

        {% set bed     = params.BED|default(params.BED_TEMP|default(0))|float %}
        {% set noz     = params.EXTRUDER|default(params.EXTRUDER_TEMP|default(params.TOOL_TEMP|default(200)))|float %}
        {% set chamber = params.CHAMBER|default(params.CHAMBER_TEMP|default(0))|float %}

        {action_respond_info("PRINT_START: bed=%sC  nozzle=%sC  chamber=%sC  file=%s" % (
            bed|string, noz|string, chamber|string,
            printer.print_stats.filename|default("unknown")))}

        # -- Parse print duration from filename -------------------------------
        {% set fname   = printer.print_stats.filename|default("")|string %}
        {% set dur_sec = get_duration_from_name(fname)|int %}
        {% set dur_min = (dur_sec / 60.0) if dur_sec >= 0 else cfg.soak_default_minutes|float %}

        # -- Chamber bypass check ---------------------------------------------
        {% set chamber_sensor  = cfg.chamber_sensor|string|trim %}
        {% set skip_within     = cfg.skip_if_chamber_within|float %}
        {% set chamber_is_hot  = false %}

        {% if chamber_sensor and skip_within > 0 and chamber > 0 %}
            {% set ctemp_str = get_chamber_temp(chamber_sensor) %}
            {% if ctemp_str and ctemp_str|float >= (chamber - skip_within) %}
                {% set chamber_is_hot = true %}
            {% endif %}
        {% endif %}

        # -- Should we soak? --------------------------------------------------
        {% set should_soak = (
            not chamber_is_hot
            and bed >= cfg.min_bed_temp_to_trigger|float
            and dur_min >= cfg.min_print_minutes_to_trigger|float
        ) %}

        {action_respond_info("Heatsoak decision: should_soak=%s  dur_min=%s  chamber_hot=%s" % (
            should_soak|string, dur_min|round(1)|string, chamber_is_hot|string))}

        {% if not should_soak %}
            SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=heatsoak_active VALUE=0
            # ==== MMU SUPPORT SECTION HOOK (no-soak path) ====================
            # If your printer has an MMU, call your pre-home safety check and
            # gate/tool precheck here, before PRINT_START_BASE. See the MMU
            # SUPPORT SECTION near the bottom of this file. Delete this
            # comment block if you don't have an MMU.
            # ===================================================================
            # EXTRUSION_MODE_RESET (2026-10-05): start the printer's own sequence in
            # relative extrusion with E zeroed, whatever ran before (a filament load
            # can leave M82). The slicer's own M83 only comes after this.
            M83
            G92 E0
            PRINT_START_BASE {rawparams}

        {% else %}
            {% set raw_soak = cfg.soak_sec_per_print_min|float * dur_min %}
            {% set soak_sec = [[raw_soak, cfg.soak_min_seconds|float]|max,
                                cfg.soak_max_seconds|float]|min %}

            # Store decoded named fields, not the slicer's raw {rawparams}
            # string -- see CHANGELOG at the top of this file for why. Add
            # whatever named params your own slicer profile passes.
            {% set _ = state.update({
                "bed":            bed|float,
                "noz":            noz|float,
                "soak_total":     soak_sec|float,
                "heating":        true,
                "chamber_target": chamber|float,
                "print_dur_sec":  dur_sec|int,
                "layer":          params.LAYER|default("")|string,
                "filament":       params.FILAMENT|default("")|string,
                "exclude":        params.EXCLUDE|default("")|string,
                "surface":        params.SURFACE|default("")|string,
                "oapa":           params.OAPA|default("")|string,
                "dmgcc":          params.DMGCC|default("")|string,
            }) %}

            SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=heatsoak_active VALUE=1
            SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=state VALUE="{state}"

            SAVE_GCODE_STATE NAME=HEATSOAK_STATE

            # Start bed heating (don't block yet)
            M140 S{bed}

            # Home if needed
            {% if printer.toolhead.homed_axes|lower != "xyz" %}
                G28
            {% endif %}

            # ==== MMU SUPPORT SECTION HOOK (should-soak path) ================
            # If your printer has an MMU, call your pre-home safety check and
            # gate/tool precheck HERE -- before BASE_PAUSE/the popup below, not
            # after. Some MMU precheck commands (e.g. Happy Hare's
            # MMU_CHECK_GATE, called via MMU_START_CHECK) can perform a real
            # physical tool load as part of "checking" it, not just a sensor
            # read -- running that before the pause keeps it associated with
            # print-start setup instead of looking like it's happening mid-
            # soak. See the MMU SUPPORT SECTION near the bottom of this file
            # for a full worked example (Happy Hare / Tradrack-style MMU).
            # Delete this comment block if you don't have an MMU.
            # ===================================================================

            # THIS IS WHAT ACTUALLY BLOCKS THE PRINT DURING THE SOAK.
            # Everything above and below this line (popup, countdown,
            # delayed_gcode timers) is purely cosmetic without it: this
            # macro's gcode block simply returns once it reaches this point,
            # and Klipper immediately continues executing the NEXT lines in
            # the sliced file (the real print body) regardless of
            # heatsoak_active/soak_left. This calls Klipper's real
            # pause_resume.pause(), matched by _resolve_resume_macro() in
            # resume_and_start() above once the soak completes or Skip is hit.
            #
            # The actual macro name (BASE_PAUSE vs PAUSE_BASE, depending on
            # your [gcode_macro PAUSE]'s rename_existing) is auto-detected by
            # _resolve_pause_macro() above -- no manual verification needed
            # before deploying anymore. If neither name exists on this
            # printer it hard-errors here instead of silently doing nothing,
            # unlike the old hardcoded-name version: a wrong/missing name
            # used to fail as a silent "Unknown command" that let a real
            # layer print underneath a "running" soak on the Voron 0,
            # 2026-08-04/05. Matches the community-standard "interruptible
            # heat soak" pattern (Klipper Discourse topic 1552).
            { _resolve_pause_macro() }

            # Backstop: verify 1s from now that the pause actually stopped
            # the file (can't be checked in this same render -- see
            # [delayed_gcode _HEATSOAK_PAUSE_GUARD]).
            UPDATE_DELAYED_GCODE ID=_HEATSOAK_PAUSE_GUARD DURATION=1

            # Show popup immediately, BEFORE machine starts moving
            { show_ui(soak_sec|int) }

            # Build-plate SVG layout -- sent once to the Console tab (not the
            # popup, see draw_buildplate_layout_svg() above for why), right
            # alongside the popup so it's available to check during the soak.
            {% if printer.exclude_object is defined and printer.exclude_object.objects %}
                {action_respond_info(draw_buildplate_layout_svg(
                    printer.exclude_object.objects,
                    printer.toolhead.axis_maximum.x|float,
                    printer.toolhead.axis_maximum.y|float))}
            {% endif %}

            # Physical prep fires 0.1s later so popup renders first. Prep
            # itself schedules the countdown heartbeat once bed/nozzle/park
            # are actually done -- see CHANGELOG (2026-08-27) and the note
            # at the end of [delayed_gcode _HEATSOAK_PREP].
            UPDATE_DELAYED_GCODE ID=_HEATSOAK_PREP DURATION=0.1
        {% endif %}

    {% endif %}

    SET_GCODE_VARIABLE MACRO={SELF} VARIABLE=state VALUE="{state}"


# =============================================================================
#  PRINT_START_BASE  --  machine-specific pre-print sequence
# =============================================================================
#  Runs after heatsoak completes (or immediately if no soak needed).
#  Replace the body with your printer's specific sequence.
#  All slicer params are available via params.*
# =============================================================================

[gcode_macro PRINT_START_BASE]
description: Machine-specific pre-print sequence. Runs after heatsoak completes.
gcode:
    {% set bed = params.BED|default(params.BED_TEMP|default(60))|float %}
    {% set noz = params.EXTRUDER|default(params.EXTRUDER_TEMP|default(200))|float %}

    {action_respond_info("PRINT_START_BASE: bed=%sC  nozzle=%sC" % (bed|string, noz|string))}

    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout|int}

    # --------------------------------------------------------------------------
    #  CUSTOMISE FROM HERE DOWN for your specific machine
    # --------------------------------------------------------------------------

    # -- Re-home, level, mesh -- always in this order, always HOT, always here --
    # Stated as a standing requirement 2026-08-06: a hot final homing of at
    # least Z is always required after the soak -- never rely on whatever
    # homing happened before/during the soak (e.g. to let a pause macro park
    # safely) carrying over as "good enough". On machines with bed leveling
    # (QGL, Z-tilt, etc.), that leveling pass must ALSO happen hot, after the
    # soak, before the bed mesh. Bed mesh itself must always be done after the
    # soak too. On some machines you'll ALSO want an additional COOL rough
    # pass done first (before/during the soak, to get close) -- that's fine
    # and often free (whatever pre-soak homing the pause needs doubles as it)
    # -- but the hot pass after the soak is never optional or skippable.
    # Thermal expansion during the soak measurably shifts gantry/frame
    # geometry and probe trigger height; anything captured cold doesn't
    # reflect the printer's actual hot-running geometry, which defeats a good
    # part of why the heatsoak exists.
    #
    # Concrete gotcha hit on the Rat (RatOS), 2026-08-06: a plain re-home call
    # after resume looked sufficient, but RatOS's own leveling step only runs
    # "if not <leveling_module>.applied" -- and a homing pass done BEFORE the
    # soak (to let PAUSE park) had already flipped that flag true, silently
    # skipping the hot leveling pass entirely even though Z itself got
    # "re-homed". If your printer has a similar leveling module with its own
    # "already applied" state, make sure your post-soak re-home actually
    # resets it (e.g. Klipper's z_tilt/quad_gantry_level clear `.applied` on a
    # genuine re-home) -- don't just trust that calling a home command is
    # equivalent to a fresh check-and-recalibrate.
    G28

    # Bed mesh -- after re-home/leveling above, still hot.
    BED_MESH_CALIBRATE

    # Heat to print temperatures
    M190 S{bed}
    M109 S{noz}

    # Purge / prime -- uncomment whichever applies:
    # LINE_PURGE          # KAMP
    # VORON_PURGE
    # SMART_PARK

    # If your printer has an MMU, load the initial tool and purge HERE, after
    # the nozzle is actually at print temp -- e.g. (Happy Hare):
    #   MMU_START_LOAD_INITIAL_TOOL
    #   LINE_PURGE
    # Do NOT call this from the slicer's start gcode instead -- PRINT_START
    # returns almost immediately (it just shows a popup and schedules async
    # prep), so the slicer's next line would run essentially immediately too,
    # loading filament and purging long before the actual soak/heat-up
    # finished. See MMU SUPPORT SECTION below.

    G92 E0

    # --------------------------------------------------------------------------
    #  END CUSTOMISATION
    # --------------------------------------------------------------------------


# =============================================================================
#  CANCEL TEARDOWN -- call from your CANCEL_PRINT (was a wrapper, see below)
# =============================================================================
#  Whatever CANCEL_PRINT resolves to on your printer (Happy Hare's client
#  macros, a stock Klipper CANCEL_PRINT, or your own override) is what
#  actually runs when Mainsail's cancel button or any API-level CANCEL_PRINT
#  call fires. PRINT_START's own [X] Cancel button (the CANCEL branch above)
#  is a SEPARATE code path -- it only runs if someone specifically clicks
#  that popup button. Any OTHER cancellation (Mainsail's UI, a raw
#  CANCEL_PRINT command) bypasses this macro entirely, leaving its recurring
#  _HEATSOAK_UPDATE timer (and any pending _HEATSOAK_PREP) running completely
#  unaware the print was cancelled -- which is exactly the "heatsoak still
#  firing after cancel" bug this wrapper prevents.
#
#  (Obsolete since 2026-10-02, kept for history:) If you have another layer
#  that defines its own fully-wrapped CANCEL_PRINT (e.g. an MMU's client
#  macros), make sure THIS include comes after that one in printer.cfg, so
#  rename_existing below captures the fully-wrapped version, not something
#  earlier/incomplete in the include chain. -- This advice was wrong: Klipper
#  merges same-named sections rather than chaining them. See below.
# =============================================================================


#  2026-10-02 -- REPLACED. This section used to be a same-named
#  [gcode_macro CANCEL_PRINT] wrapper (rename_existing:
#  HEATSOAK_TRUE_CANCEL_PRINT). Klipper does not chain two same-named
#  sections -- it MERGES them, so the wrapper's gcode silently replaced your
#  printer's own CANCEL_PRINT body (park, heaters off, motors off...) and
#  only stock Klipper cancel ever ran. Found live on Sophie and Max.
#
#  HOOKUP (one line, required): call _HEATSOAK_CANCEL_TEARDOWN as the FIRST
#  line of whatever CANCEL_PRINT your printer actually uses (your own
#  printer.cfg override or sovol-style macros file). It is a no-op when no
#  soak is active. Hook spots the startup check also accepts, for stacks
#  whose CANCEL_PRINT lives in a vendor file you shouldn't edit:
#    * mainsail/fluidd client.cfg: variable_user_cancel_macro:
#      "_HEATSOAK_CANCEL_TEARDOWN" (in your own [gcode_macro CANCEL_PRINT]
#      override of just that variable)
#    * RatOS: override the empty user hook
#      [gcode_macro _USER_END_PRINT_BEFORE_HEATERS_OFF] after RatOS.cfg is
#      included (RatOS's CANCEL_PRINT runs END_PRINT, which calls it)
#    * Happy Hare: variable_user_cancel_extension:
#      "_HEATSOAK_CANCEL_TEARDOWN" in mmu_macro_vars.cfg
#  Example:
#      [gcode_macro CANCEL_PRINT]
#      rename_existing: BASE_CANCEL_PRINT
#      gcode:
#        _HEATSOAK_CANCEL_TEARDOWN
#        ...your existing cancel lines...
#  _HEATSOAK_STARTUP_CLEAR prints a console error at every Klipper start
#  until this hookup is in place.
# =============================================================================

[gcode_macro _HEATSOAK_CANCEL_TEARDOWN]
description: Stop an active heatsoak (timers, popup, soak fans, saved gcode state). Call first thing in your CANCEL_PRINT. No-op if no soak is active.
gcode:
    {% set st = printer["gcode_macro PRINT_START"] %}
    {% if st.state and (st.state|string) != "{}" and st.heatsoak_active %}
        {action_respond_info("Heatsoak: tearing down for CANCEL_PRINT")}
        UPDATE_DELAYED_GCODE ID=_HEATSOAK_UPDATE DURATION=0
        UPDATE_DELAYED_GCODE ID=_HEATSOAK_PREP DURATION=0
        UPDATE_DELAYED_GCODE ID=_HEATSOAK_HEATUP_TICK DURATION=0
        UPDATE_DELAYED_GCODE ID=_HEATSOAK_PAUSE_GUARD DURATION=0
        RESPOND TYPE=command MSG="action:prompt_end"
        SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=heatsoak_active VALUE=0
        M106 S0
        M107
        RESTORE_GCODE_STATE NAME=HEATSOAK_STATE MOVE=0
        SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=state VALUE="{{}}"
    {% endif %}


# =============================================================================
#  RESUME CHECK -- call from your RESUME: Resume during a soak = Skip
# =============================================================================
#  The soak holds the print with a real pause, so anything that sends RESUME
#  (Mainsail/Fluidd's button, KlipperScreen, a printer's touchscreen) would
#  otherwise release it: the file would carry on straight into the print
#  body on a bed that isn't soaked, skipping PRINT_START_BASE's hot re-home/
#  mesh, while the soak's timers kept running. See CHANGELOG 2026-10-03.
#
#  HOOKUP (one line, required): call _HEATSOAK_RESUME_CHECK as the FIRST line
#  of whatever RESUME your printer actually uses, before anything that moves,
#  extrudes or calls the base resume. It is a no-op when no soak is active.
#  Hook spots the startup check also accepts, for stacks whose RESUME lives
#  in a vendor file you shouldn't edit:
#    * mainsail/fluidd client.cfg: in your [gcode_macro _CLIENT_VARIABLE],
#      variable_user_resume_macro: "_HEATSOAK_RESUME_CHECK"
#      (client.cfg runs it right before _CLIENT_EXTRUDE/RESUME_BASE)
#    * Happy Hare: variable_user_resume_extension in mmu_macro_vars.cfg
#  If your printer's RESUME is plain Klipper (no [gcode_macro RESUME] at all),
#  add a pass-through wrapper:
#      [gcode_macro RESUME]
#      rename_existing: BASE_RESUME
#      gcode:
#        _HEATSOAK_RESUME_CHECK
#        BASE_RESUME {rawparams}
#
#  How it stops YOUR RESUME: a macro can't "return early" from the macro that
#  called it, but an error can -- Klipper aborts the rest of the calling
#  script. So during a soak this arms the Skip on a 0.1s timer first, then
#  raises. The timer runs right after your RESUME has been aborted, and does
#  exactly what the popup's Skip button does.
# =============================================================================

[gcode_macro _HEATSOAK_RESUME_CHECK]
description: Call first thing in your RESUME. During a heatsoak, turns Resume into Skip and stops the rest of your RESUME. No-op otherwise.
gcode:
    {% set st = printer["gcode_macro PRINT_START"] %}
    {% if st.state and (st.state|string) != "{}" and st.heatsoak_active %}
        UPDATE_DELAYED_GCODE ID=_HEATSOAK_RESUME_AS_SKIP DURATION=0.1
        # Separate macro: an error raised in THIS macro's own template would
        # fire while it renders, before the timer line above ever ran.
        _HEATSOAK_STOP_RESUME
    {% endif %}

[gcode_macro _HEATSOAK_STOP_RESUME]
description: Internal -- aborts the RESUME that called _HEATSOAK_RESUME_CHECK during a soak.
gcode:
    {action_raise_error("Heatsoak: Resume pressed during the soak -- skipping the rest of the soak instead (this message is expected)")}

[delayed_gcode _HEATSOAK_RESUME_AS_SKIP]
gcode:
    PRINT_START SKIP=1


# =============================================================================
#  MMU SUPPORT SECTION  --  OPTIONAL, delete entirely if you don't have an MMU
# =============================================================================
#  Background: this whole section exists because of what happened deploying
#  this template on a Voron 0 with a Tradrack MMU / Happy Hare v4
#  (2026-08-04/05). Two things specific to MMU-equipped printers came up
#  that a non-MMU printer will never hit:
#
#  1. Happy Hare's MMU_START_CHECK (gate/tool precheck, called via
#     MMU_CHECK_GATE) can perform a REAL physical tool select-and-load as
#     part of "checking" the initial tool, not just a sensor read -- this
#     happens when Happy Hare's own internal is_printing() state hasn't
#     flipped to "printing" yet. Calling it needs to happen before the
#     popup/pause below (the MMU SUPPORT SECTION HOOK comments in the INIT
#     branch above mark exactly where), so the real toolchange this can
#     trigger stays visually tied to print-start setup, not mid-soak.
#
#  2. Filament can be left sitting at a gate sensor from a previous failed
#     load/unload. Homing the selector across the gate array while filament
#     is caught in its path is a real jam risk, so a pre-home safety check
#     is needed before ANY MMU homing happens.
#
#  The example below is written for Happy Hare specifically (MMU_CHECK_GATE,
#  MMU_TEST_HOMING_MOVE, a filament_switch_sensor named
#  "unit0:mmu_shared_exit", a SERVO_CUTTER_ACTION cutter macro) -- adjust the
#  sensor name and cutter/trim command for your actual MMU (ERCF, ERCFv2,
#  ATC, etc.) and hardware.
# =============================================================================

[gcode_macro _MMU_CLEAR_BEFORE_HOME]
description: Retract+trim any filament stuck at the shared gate sensor before MMU homing is allowed to run. Cutter only fires once the sensor is freshly confirmed clear. Sets last_check_ok instead of raising directly, so callers (PRINT_START) get a chance to tear down their own state cleanly before aborting.
variable_last_check_ok: 1
gcode:
    # EDIT: replace with your MMU's actual gate-sensor object name.
    {% set sensor_name = "filament_switch_sensor unit0:mmu_shared_exit" %}
    SET_GCODE_VARIABLE MACRO=_MMU_CLEAR_BEFORE_HOME VARIABLE=last_check_ok VALUE=1

    {% if printer[sensor_name].filament_detected %}
        RESPOND TYPE=echo MSG="Pre-home check: filament present at shared gate sensor -- clearing before MMU homes"

        # EDIT: replace with your MMU's actual retract command/endstop name.
        MMU_TEST_HOMING_MOVE MOVE=-1200 MOTOR=gear ENDSTOP=mmu_shared_exit STOP_ON_ENDSTOP=-1 WAIT=1
        {% set cleared = not printer[sensor_name].filament_detected %}

        {% if not cleared %}
            RESPOND TYPE=echo MSG="Pre-home check: still triggered after first retract (-1200mm), extending"
            MMU_TEST_HOMING_MOVE MOVE=-600 MOTOR=gear ENDSTOP=mmu_shared_exit STOP_ON_ENDSTOP=-1 WAIT=1
            {% set cleared = not printer[sensor_name].filament_detected %}
        {% endif %}

        {% if cleared %}
            RESPOND TYPE=echo MSG="Pre-home check: sensor confirmed clear -- trimming end"
            # EDIT: replace with your MMU's actual cutter/trim macro, or
            # delete this line if your MMU has no cutter.
            SERVO_CUTTER_ACTION
        {% else %}
            RESPOND TYPE=error MSG="Pre-home safety check FAILED: filament still detected at shared gate sensor after clearing attempts. Refusing to home MMU -- manual check required."
            SET_GCODE_VARIABLE MACRO=_MMU_CLEAR_BEFORE_HOME VARIABLE=last_check_ok VALUE=0
        {% endif %}
    {% endif %}

# To wire this in, add to the two "MMU SUPPORT SECTION HOOK" spots in
# PRINT_START's INIT branch above (both the should-soak and no-soak paths):
#
#     _MMU_CLEAR_BEFORE_HOME
#     {% if not printer["gcode_macro _MMU_CLEAR_BEFORE_HOME"].last_check_ok %}
#         {# on the should-soak path only: tear down heatsoak_active/state
#            and zero_soak_fans()/RESTORE_GCODE_STATE like the Cancel button
#            does first, so nothing is left dangling -- see the Voron 0
#            deployment for the full teardown block #}
#         {action_raise_error("Heatsoak: aborting -- MMU pre-home check failed")}
#     {% endif %}
#     MMU_START_CHECK
#
# (MMU_START_CHECK itself is a Happy Hare built-in command, not defined in
# this file -- it ships with Happy Hare's own macros.)

# SLICER_COMPAT_ALIAS (optional) ----------------------------------------------
#  Slicer profiles call either START_PRINT or PRINT_START. If yours calls the
#  one your printer DOESN'T define, Klipper prints "Unknown command" and keeps
#  going -- skipping the whole start sequence (mesh, Z-offset, soak) without
#  stopping the print. Uncomment ONLY if START_PRINT is not already defined
#  anywhere in your config: Klipper merges same-named sections instead of
#  erroring, so this would silently replace an existing START_PRINT.
#  (If you renamed the entry to START_PRINT, flip the two names around.)
#  With no temps passed (stock slicer line), BED_TEMP/EXTRUDER_TEMP come from
#  the current heater targets so the soak still sees real temps.
#
# [gcode_macro START_PRINT]
# description: Slicer-compat alias for PRINT_START
# gcode:
#     {% set extra = "" %}
#     {% set internal = params.TICK is defined or params.SKIP is defined or params.CANCEL is defined or params.HEATUP_TICK is defined %}
#     {% if not internal %}
#         {% if params.BED is not defined and params.BED_TEMP is not defined and printer.heater_bed.target|float > 0 %}
#             {% set extra = extra ~ " BED_TEMP=" ~ printer.heater_bed.target|int %}
#         {% endif %}
#         {% if params.EXTRUDER is not defined and params.EXTRUDER_TEMP is not defined and params.TOOL_TEMP is not defined and printer.extruder.target|float > 0 %}
#             {% set extra = extra ~ " EXTRUDER_TEMP=" ~ printer.extruder.target|int %}
#         {% endif %}
#     {% endif %}
#     {action_respond_info("START_PRINT -> PRINT_START " ~ rawparams ~ extra)}
#     PRINT_START {rawparams}{extra}
